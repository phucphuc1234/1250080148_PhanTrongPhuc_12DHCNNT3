<text x="1475.0" y="1939.6999999999998" text-anchor="middle" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#222222">Nhánh không đạt là giả định phân tích để hoàn chỉnh luồng; đề gốc mô tả nhánh đạt. Câu 4–5 dừng tại ký hợp đồng.</text>
